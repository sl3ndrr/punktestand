name: Browser- und Tablet-Prüfung
on:
  push:
    branches: [main]
    paths: ['index.html', 'tests/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['index.html', 'tests/**', '.github/workflows/test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-pruefung
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
