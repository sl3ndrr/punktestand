<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punktestand</title>
<style>
:root{
  --bg:#f5f5f2;--card:#fff;--text:#16181d;--muted:#80858f;--line:#e6e6e1;--btn:#efefea;--btn-h:#e4e4de;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101114;--card:#1a1c21;--text:#f1f2f4;--muted:#8b909b;--line:#2a2d34;--btn:#262930;--btn-h:#30343c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101114;--card:#1a1c21;--text:#f1f2f4;--muted:#8b909b;--line:#2a2d34;--btn:#262930;--btn-h:#30343c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--btn);border-radius:14px;touch-action:manipulation;transition:background .15s,transform .1s}
button:hover{background:var(--btn-h)}
button:active{transform:scale(.95)}
:focus-visible{outline:2px solid var(--c,#4f8cff);outline-offset:2px}
.wrap{max-width:1800px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px;min-height:100dvh}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar h1{font-size:1.15rem;font-weight:650;margin:0 auto 0 4px;letter-spacing:-.01em}
.seg{display:flex;background:var(--btn);border-radius:12px;padding:3px}
.seg button{background:none;padding:8px 12px;border-radius:9px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tool{padding:10px 14px;font-size:.85rem}
.tool:disabled{opacity:.4;cursor:default}
.diff{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.diff .n{display:inline-block;font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.diff .t{color:var(--muted);font-size:.95rem}
.diff .t b{color:var(--text);font-weight:600}
#app{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;flex:1;align-content:stretch}
.card{min-width:0;container-type:inline-size;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--c)}
.head{display:flex;align-items:center;gap:8px}
.name{flex:1;min-width:0;background:none;border:0;font-size:1.1rem;font-weight:600;padding:6px 4px;border-radius:8px}
.name:hover{background:var(--btn)}
.del{width:36px;height:36px;padding:0;background:none;color:var(--muted);font-size:1.3rem;border-radius:50%}
.badge{font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--btn);color:var(--muted);white-space:nowrap}
.badge.lead{background:var(--c);color:#fff}
.main{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:1;min-height:130px}
.round{width:clamp(56px,16vw,78px);height:clamp(56px,16vw,78px);border-radius:50%;font-size:2rem;padding:0;flex:none;line-height:1}
.score{font-size:clamp(1rem,calc(70cqi / var(--digits,3)),8rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.04em;text-align:center;line-height:1;min-width:0;overflow:hidden;text-overflow:clip}
.custom{display:flex;gap:8px}
.custom input{flex:1;min-width:0;background:var(--btn);border:0;border-radius:14px;padding:0 14px;height:52px;font-size:1.15rem;text-align:center;font-variant-numeric:tabular-nums}
.custom input::placeholder{color:var(--muted)}
.custom button{width:60px;height:52px;font-size:1.4rem;padding:0}
.add{background:none;border:2px dashed var(--line);color:var(--muted);padding:14px;font-size:.95rem;border-radius:20px}
.add:hover{background:var(--btn)}
.add:disabled{opacity:.4;cursor:default}
/* Tablets: Anzahl der Karten statt einer festen Mindestbreite entscheidet. */
@media (min-width:700px){
  .wrap{padding:20px clamp(16px,2vw,32px) 20px;gap:12px}
  #app{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #app[data-count="3"] .card:last-child{grid-column:1 / -1}
  #app[data-count="7"],#app[data-count="8"]{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{padding:12px 14px 14px;gap:10px}
  .main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto;gap:10px;min-height:140px}
  .score{grid-column:1 / -1;grid-row:1;font-size:clamp(1rem,calc(145cqi / var(--digits,3)),16rem)}
  .round{grid-row:2;width:clamp(56px,23cqi,104px);height:auto;aspect-ratio:1;font-size:clamp(2rem,9cqi,3rem)}
  .round:last-child{justify-self:end}
  .custom input,.custom button{height:48px}
  .custom button{width:clamp(48px,20cqi,72px);flex:none}
  .name{font-size:1rem}
}
@media (min-width:1000px){
  #app[data-count="3"],#app[data-count="5"],#app[data-count="6"]{grid-template-columns:repeat(3,minmax(0,1fr))}
  #app[data-count="3"] .card:last-child{grid-column:auto}
}
@media (min-width:1100px){
  #app[data-count="7"],#app[data-count="8"]{grid-template-columns:repeat(4,minmax(0,1fr))}
}
.notice{margin:0;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.theme{position:relative;width:58px;height:34px;padding:0 9px;border-radius:99px;display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
.theme svg{width:16px;height:16px;position:relative;z-index:1;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:color .25s}
.theme[aria-checked="false"] .sun,.theme[aria-checked="true"] .moon{color:var(--text)}
.knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.theme[aria-checked="true"] .knob{transform:translateX(24px)}
body,.card,.diff,.seg,.seg button,button{transition:background-color .3s,color .3s,border-color .3s,transform .1s}
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,11,14,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease-out}
.ov[hidden]{display:none}
.sheet{background:var(--card);color:var(--text);width:min(100%,620px);max-height:94dvh;overflow:auto;border-radius:28px 28px 0 0;padding:26px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;animation:sheet .45s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.ov{align-items:center;padding:24px}.sheet{border-radius:28px;padding-bottom:22px}}
.win{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.crown{width:64px;height:64px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;animation:pop .6s .15s both}
.crown svg{width:32px;height:32px;fill:currentColor}
.win small{color:var(--muted);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.win h2{margin:0;font-size:clamp(2rem,9vw,2.8rem);line-height:1.1;letter-spacing:-.02em;color:var(--c);overflow-wrap:anywhere;animation:rise .5s .2s both}
.win.tie h2{color:var(--text)}
.win p{margin:0;color:var(--muted)}
.sec{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--btn);animation:rise .4s both}
.rank li.w{background:color-mix(in srgb,var(--c) 16%,transparent)}
.rank .no{width:1.2em;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rank .sc{font-weight:700;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.tx{fill:var(--muted);font-size:14px;font-family:inherit}
.ln{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.3,.6,.2,1) forwards}
.dt{opacity:0;animation:fade .3s forwards}
.empty{color:var(--muted);margin:0;padding:18px;text-align:center;background:var(--btn);border-radius:14px}
.acts{display:flex;gap:10px}
.acts button{flex:1;padding:16px 10px;font-weight:600}
.acts .primary{background:var(--text);color:var(--card)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ln{stroke-dashoffset:0}.dt{opacity:1}}
@keyframes up{from{transform:translateY(24%);opacity:.3}to{transform:none;opacity:1}}
@keyframes down{from{transform:translateY(-24%);opacity:.3}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:scale(.92)}}
.score.up{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.score.down{animation:down .3s cubic-bezier(.2,.8,.2,1)}
.badge.pop,.diff .n.pop{animation:pop .4s ease-out}
.card.enter{animation:enter .4s cubic-bezier(.2,.8,.2,1)}
.card.leaving{animation:leave .22s ease-in forwards;pointer-events:none}
.card.lead{box-shadow:0 12px 34px -16px var(--c)}
.round:active,.custom button:active{transform:scale(.9)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>Punktestand</h1>
    <div class="seg" role="group" aria-label="Wertung">
      <button data-a="mode" data-m="low">Niedrig gewinnt</button>
      <button data-a="mode" data-m="high">Hoch gewinnt</button>
    </div>
    <button class="tool" data-a="undo" id="undo">Zurück</button>
    <button class="tool" data-a="reset" id="reset">Neue Runde</button>
    <button class="tool" data-a="fs" id="fs" hidden>Vollbild</button>
    <button class="theme" id="theme" data-a="theme" role="switch" aria-checked="false" aria-label="Dunkelmodus">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="knob"></span>
    </button>
  </div>
  <div class="diff" id="diff"></div>
  <p class="notice" id="notice" role="status" hidden></p>
  <div id="app"></div>
  <button class="add" id="addp" data-a="addp">+ Spieler hinzufügen</button>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Ergebnis" hidden></div>

<script>
const KEY = 'punktestand-v1';
const COLORS = ['#4f8cff','#ff7a59','#2fb67c','#b072f0','#e0a410','#e85d9a','#22b5c8','#8a94a6'];
const MAX = 8;
let S = null, hist = [];

function mk(name, i){ return { id: 'p' + Date.now().toString(36) + i + Math.floor(Math.random()*1000), name, score: 0, amt: '', c: COLORS[i % COLORS.length] }; }
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (!d || !Array.isArray(d.players) || d.players.length < 2 || d.players.length > MAX) return null;
    const ids = new Set();
    const players = d.players.map((p, i) => {
      if (!p || typeof p.id !== 'string' || !/^p[a-zA-Z0-9-]+$/.test(p.id) || ids.has(p.id) || !Number.isSafeInteger(p.score)) throw new Error('Ungültiger Spielstand');
      ids.add(p.id);
      return {id:p.id,name:typeof p.name === 'string' ? p.name.slice(0,20) || 'Spieler' : 'Spieler',score:p.score,
        amt:typeof p.amt === 'string' && /^\d*$/.test(p.amt) ? p.amt : '',c:COLORS.includes(p.c) ? p.c : COLORS[i]};
    });
    const log = Array.isArray(d.log) ? d.log.slice(-2000).filter(m => m && typeof m === 'object').map(m =>
      Object.fromEntries(players.filter(p => Number.isSafeInteger(m[p.id])).map(p => [p.id,m[p.id]]))) : [];
    return {mode:d.mode === 'high' ? 'high' : 'low',players,log,theme:['light','dark'].includes(d.theme) ? d.theme : undefined};
  } catch (e) {}
  return null;
}
function notice(message){ $('notice').textContent = message; $('notice').hidden = !message; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { notice('Dieser Browser kann den Spielstand nicht speichern. Bitte die Seite während der Runde geöffnet lassen.'); } }
S = load() || { mode: 'low', players: [mk('Spieler 1', 0), mk('Spieler 2', 1)] };
function logPush(){ const m = {}; S.players.forEach(x => m[x.id] = x.score); S.log.push(m); if (S.log.length > 2000) S.log.shift(); }
if (!Array.isArray(S.log) || !S.log.length) { S.log = []; logPush(); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => String(n).replace('-', '\u2212');
const $ = id => document.getElementById(id);

function snap(){
  const m = {}; S.players.forEach(p => m[p.id] = p.score);
  hist.push({ t: 's', m }); if (hist.length > 100) hist.shift();
}
function change(p, d){
  if (!Number.isSafeInteger(d) || !Number.isSafeInteger(p.score + d)) { notice('Diese Punktzahl ist zu groß. Bitte einen kleineren Wert eingeben.'); return false; }
  snap(); p.score += d; logPush(); notice(''); save(); render(); return true;
}

function standings(){
  const low = S.mode === 'low';
  const sorted = [...S.players].sort((a, b) => low ? a.score - b.score : b.score - a.score);
  return { sorted, best: sorted[0].score };
}

function render(){
  const active = document.activeElement, activeCard = active?.closest('.card');
  const focus = activeCard ? {id:activeCard.dataset.id,a:active.dataset.a,d:active.dataset.d,s:active.dataset.s,f:active.dataset.f} : null;
  const { sorted, best } = standings();
  const leaders = S.players.filter(p => p.score === best);
  $('app').dataset.count = S.players.length;
  $('app').innerHTML = S.players.map(p => {
    const gap = Math.abs(p.score - best);
    const badge = p.score === best
      ? `<span class="badge lead">${leaders.length > 1 ? 'Gleichauf' : 'Führt'}</span>`
      : `<span class="badge">${gap} zurück</span>`;
    return `<section class="card${leaders.length === 1 && p.score === best ? ' lead' : ''}" style="--c:${p.c}" data-id="${p.id}">
      <div class="head">
        <input class="name" value="${esc(p.name)}" maxlength="20" aria-label="Name" data-f="name">
        ${badge}
        ${S.players.length > 2 ? `<button class="del" data-a="del" aria-label="${esc(p.name)} entfernen">\u00d7</button>` : ''}
      </div>
      <div class="main">
        <button class="round" data-a="step" data-d="-1" aria-label="Minus 1">\u2212</button>
        <div class="score" style="--digits:${Math.max(3,fmt(p.score).length)}" aria-live="polite">${fmt(p.score)}</div>
        <button class="round" data-a="step" data-d="1" aria-label="Plus 1">+</button>
      </div>
      <div class="custom">
        <button data-a="apply" data-s="-1" aria-label="Wert abziehen">\u2212</button>
        <input type="number" inputmode="numeric" min="0" step="1" placeholder="Wert" value="${esc(p.amt)}" data-f="amt" aria-label="Wert zum Addieren oder Abziehen">
        <button data-a="apply" data-s="1" aria-label="Wert addieren">+</button>
      </div>
    </section>`;
  }).join('');

  // Differenz
  const d = $('diff');
  if (leaders.length > 1) {
    d.innerHTML = `<span class="n">0</span><span class="t">Gleichstand an der Spitze</span>`;
  } else {
    const diff = Math.abs(sorted[1].score - best);
    d.innerHTML = `<span class="n">${diff}</span><span class="t"><b>${esc(sorted[0].name)}</b> liegt vorn${S.players.length > 2 ? ' vor ' + esc(sorted[1].name) : ''}</span>`;
  }

  document.querySelectorAll('[data-a="mode"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === S.mode)));
  $('undo').disabled = hist.length === 0;
  $('addp').disabled = S.players.length >= MAX;
  if (focus) {
    const card = [...$('app').children].find(c => c.dataset.id === focus.id);
    const next = card && [...card.querySelectorAll('button,input')].find(el =>
      el.dataset.a === focus.a && el.dataset.d === focus.d && el.dataset.s === focus.s && el.dataset.f === focus.f);
    next?.focus({preventScroll:true});
  }
  animate();
}

function apply(p, sign){
  if (!p.amt.trim()) return;
  const v = Math.abs(Number(p.amt));
  if (!Number.isSafeInteger(v)) { notice('Bitte eine ganze Zahl eingeben.'); return; }
  if (v === 0) return;
  if (!Number.isSafeInteger(p.score + sign * v)) { notice('Diese Punktzahl ist zu groß. Bitte einen kleineren Wert eingeben.'); return; }
  p.amt = '';
  change(p, sign * v);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  const card = b.closest('.card');
  const p = card ? S.players.find(x => x.id === card.dataset.id) : null;
  if (a === 'step' && p) change(p, +b.dataset.d);
  else if (a === 'apply' && p) apply(p, +b.dataset.s);
  else if (a === 'del' && p) {
    if (S.players.length <= 2) return;
    hist.push({ t: 'd', p: { ...p }, i: S.players.indexOf(p) });
    S.players = S.players.filter(x => x !== p); save(); render(); $('addp').focus({preventScroll:true});
  }
  else if (a === 'addp') {
    if (S.players.length < MAX) {
      const np = mk('Spieler ' + (S.players.length + 1), S.players.length);
      S.players.push(np); logPush(); hist.push({ t: 'a', id: np.id }); save(); render();
    }
  }
  else if (a === 'mode') { S.mode = b.dataset.m; save(); render(); }
  else if (a === 'fs') toggleFs();
  else if (a === 'theme') { S.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); }
  else if (a === 'undo') {
    const h = hist.pop();
    if (h) {
      if (h.t === 's') { S.players.forEach(x => { if (x.id in h.m) x.score = h.m[x.id]; }); if (S.log.length > 1) S.log.pop(); }
      else if (h.t === 'd') S.players.splice(Math.min(h.i, S.players.length), 0, h.p);
      else if (h.t === 'a' && S.players.length > 2) { S.players = S.players.filter(x => x.id !== h.id); if (S.log.length > 1) S.log.pop(); }
      save(); render();
    }
  }
  else if (a === 'reset') showResult();
  else if (a === 'newgame') newGame();
  else if (a === 'close') closeResult();
});

document.addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return;
  const p = S.players.find(x => x.id === e.target.closest('.card').dataset.id); if (!p) return;
  if (f === 'amt') p.amt = e.target.value;
  if (f === 'name') p.name = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.dataset.f === 'name') { if (!e.target.value.trim()) { const p = S.players.find(x => x.id === e.target.closest('.card').dataset.id); p.name = 'Spieler'; } save(); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.f === 'amt') {
    const p = S.players.find(x => x.id === e.target.closest('.card').dataset.id);
    if (p) apply(p, 1);
  }
});

/* Ergebnis */
let resultFocus = null, previousOverflow = '';
function chartSVG(){
  const L = S.log, n = L.length;
  if (n < 2) return '<p class="empty">Noch keine Punkte erfasst.</p>';
  const W = 480, H = 300, ml = 40, mr = 16, mt = 14, mb = 30;
  let lo = Infinity, hi = -Infinity;
  S.players.forEach(p => L.forEach(m => { const v = m[p.id]; if (v !== undefined) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  if (hi === lo) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * .08; lo -= pad; hi += pad;
  const X = i => ml + (W - ml - mr) * i / (n - 1), Y = v => mt + (H - mt - mb) * (1 - (v - lo) / (hi - lo));
  const ticks = [...new Set([0, 1, 2, 3, 4].map(k => Math.round(lo + (hi - lo) * k / 4)))];
  let g = '';
  ticks.forEach(v => { const y = Y(v).toFixed(1); g += `<line class="gl" x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}"/><text class="tx" x="${ml - 8}" y="${+y + 5}" text-anchor="end">${fmt(v)}</text>`; });
  g += `<text class="tx" x="${ml}" y="${H - 6}">Start</text><text class="tx" x="${W - mr}" y="${H - 6}" text-anchor="end">Zug ${n - 1}</text>`;
  S.players.forEach((p, idx) => {
    let d = '', last = null;
    L.forEach((m, i) => { const v = m[p.id]; if (v === undefined) return; last = [X(i).toFixed(1), Y(v).toFixed(1)]; d += (d ? 'L' : 'M') + last[0] + ' ' + last[1]; });
    if (!last) return;
    g += `<path class="ln" pathLength="1" d="${d}" stroke="${p.c}" style="animation-delay:${idx * .12}s"/><circle class="dt" cx="${last[0]}" cy="${last[1]}" r="5.5" fill="${p.c}" style="animation-delay:${.9 + idx * .12}s"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Punkteverlauf">${g}</svg>`;
}
function showResult(){
  const { sorted, best } = standings();
  const win = S.players.filter(p => p.score === best), tie = win.length > 1;
  const rows = sorted.map((p, i) => {
    const rank = sorted.findIndex(q => q.score === p.score) + 1;
    return `<li class="${p.score === best ? 'w' : ''}" style="--c:${p.c};animation-delay:${.25 + i * .07}s"><span class="no">${rank}</span><span class="dot"></span><span class="nm">${esc(p.name)}</span><span class="sc">${fmt(p.score)}</span></li>`;
  }).join('');
  const pts = Math.abs(best) === 1 ? 'Punkt' : 'Punkten';
  $('ov').innerHTML = `<div class="sheet">
    <div class="win${tie ? ' tie' : ''}" style="--c:${tie ? 'var(--muted)' : win[0].c}">
      <div class="crown"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5L3 7zm2 13h14v2H5z"/></svg></div>
      <small>${tie ? 'Gleichstand' : 'Gewinner'}</small>
      <h2>${win.map(p => esc(p.name)).join(' &amp; ')}</h2>
      <p>${tie ? 'je ' : 'mit '}${fmt(best)} ${pts}</p>
    </div>
    <div><p class="sec">Endstand</p><ol class="rank">${rows}</ol></div>
    <div><p class="sec">Punkteverlauf</p>${chartSVG()}</div>
    <div class="acts"><button data-a="close">Weiterspielen</button><button class="primary" data-a="newgame">Neue Runde starten</button></div>
  </div>`;
  $('ov').hidden = false;
  resultFocus = document.activeElement;
  previousOverflow = document.body.style.overflow;
  document.querySelector('.wrap').inert = true;
  document.body.style.overflow = 'hidden';
  $('ov').querySelector('[data-a="close"]').focus();
}
function closeResult(){
  if ($('ov').hidden) return;
  $('ov').hidden = true; $('ov').innerHTML = '';
  document.querySelector('.wrap').inert = false;
  document.body.style.overflow = previousOverflow;
  if (resultFocus?.isConnected) resultFocus.focus({preventScroll:true});
}
function newGame(){
  S.players.forEach(x => { x.score = 0; x.amt = ''; });
  S.log = []; logPush(); hist = [];
  save(); closeResult(); render();
}
$('ov').addEventListener('click', e => { if (e.target === $('ov')) closeResult(); });
document.addEventListener('keydown', e => {
  if ($('ov').hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); closeResult(); }
  if (e.key === 'Tab') {
    const buttons = $('ov').querySelectorAll('button'), first = buttons[0], last = buttons[buttons.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* Animationen */
const rm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let first = true, prevS = {}, prevB = {}, prevD = null;
function roll(el, from, to){
  const t0 = performance.now(), dur = 400;
  (function f(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(k < 1 ? Math.round(from + (to - from) * e) : to);
    if (k < 1) requestAnimationFrame(f);
  })(t0);
}
function animate(){
  const cards = document.querySelectorAll('.card'), dn = $('diff').querySelector('.n');
  if (!first && !rm()) {
    cards.forEach(c => {
      const p = S.players.find(x => x.id === c.dataset.id); if (!p) return;
      const bd = c.querySelector('.badge');
      if (!(p.id in prevS)) c.classList.add('enter');
      else if (prevS[p.id] !== p.score) {
        const sc = c.querySelector('.score'), d = p.score - prevS[p.id];
        sc.classList.add(d > 0 ? 'up' : 'down');
        if (Math.abs(d) > 1) roll(sc, prevS[p.id], p.score);
      }
      if (p.id in prevB && prevB[p.id] !== bd.textContent) bd.classList.add('pop');
    });
    if (prevD !== null && prevD !== dn.textContent) dn.classList.add('pop');
  }
  prevS = {}; prevB = {};
  cards.forEach(c => { const id = c.dataset.id, p = S.players.find(x => x.id === id); if (p) { prevS[id] = p.score; prevB[id] = c.querySelector('.badge').textContent; } });
  prevD = dn.textContent; first = false;
}

/* Vollbild */
const root = document.documentElement;
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const fsOk = !!((document.fullscreenEnabled || document.webkitFullscreenEnabled) && (root.requestFullscreen || root.webkitRequestFullscreen));
function toggleFs(){
  try {
    const result = fsOn() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
      : (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    if (result?.catch) result.catch(() => notice('Vollbild ist in diesem Browser gerade nicht verfügbar.'));
  } catch (e) {}
}
function updateFs(){ $('fs').textContent = fsOn() ? 'Vollbild beenden' : 'Vollbild'; }
$('fs').hidden = !fsOk;
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, updateFs));
updateFs();

/* Hell/Dunkel */
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => S.theme ? S.theme === 'dark' : sysDark.matches;
function applyTheme(){
  if (S.theme) root.dataset.theme = S.theme; else delete root.dataset.theme;
  $('theme').setAttribute('aria-checked', String(isDark()));
}
sysDark.addEventListener('change', applyTheme);
applyTheme();

render();
</script>
</body>
